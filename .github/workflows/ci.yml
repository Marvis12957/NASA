name: agent-platform CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate board schema
        run: python3 tools/agentctl tasks
      - name: Check no conflicts on a fresh board
        run: python3 tools/agentctl conflicts
      - name: Run test suite
        run: bash tests/run_tests.sh
