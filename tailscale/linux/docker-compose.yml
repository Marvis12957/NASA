services:
  tailscale:
    image: tailscale/tailscale:stable
    container_name: nasa-tailscale
    hostname: nasa-linux
    environment:
      TS_HOSTNAME: nasa-linux
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
      TS_AUTH_ONCE: "true"
      TS_SERVE_CONFIG: /config/serve.json
      TS_EXTRA_ARGS: --accept-dns=false
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./tailscale:/config
    restart: unless-stopped

  linux:
    build: .
    image: nasa-linux-ssh
    container_name: nasa-linux
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "2222:22"
    volumes:
      - ../..:/workspace
      - ./authorized_keys:/authorized_keys:ro

volumes:
  tailscale-state:
